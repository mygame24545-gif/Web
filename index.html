<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Parkour Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <script src="level.js"></script>
    <script src="player.js"></script>
